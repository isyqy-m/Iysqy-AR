<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Web AR</title>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #000;
    }

    #ar-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
  </style>
</head>

<body>

<div id="ar-container"></div>

<script>

const container =
  document.querySelector("#ar-container");

const mindarThree =
  new MindARThree({
    container: container,

    imageTargetSrc:
      "./targets.mind"
  });

const {
  renderer,
  scene,
  camera
} = mindarThree;


// --------------------------
// LIGHT
// --------------------------

const light =
  new THREE.HemisphereLight(
    0xffffff,
    0xbbbbbb,
    3
  );

scene.add(light);


// --------------------------
// AR OBJECT
// --------------------------

const geometry =
  new THREE.PlaneGeometry(
    1,
    1
  );

const material =
  new THREE.MeshBasicMaterial({
    color: 0xff0000,
    transparent: true,
    opacity: 0.7
  });

const plane =
  new THREE.Mesh(
    geometry,
    material
  );


// --------------------------
// TARGET
// --------------------------

const anchor =
  mindarThree.addAnchor(0);

anchor.group.add(plane);


// --------------------------
// START AR
// --------------------------

async function startAR() {

  await mindarThree.start();

  renderer.setAnimationLoop(() => {

    renderer.render(
      scene,
      camera
    );

  });

}

startAR();

</script>

</body>
</html>
