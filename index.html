<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR Truk</title>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #ar-container {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

<div id="ar-container"></div>

<script>

const container =
  document.querySelector("#ar-container");

const mindarThree =
  new MindARThree({
    container: container,
    imageTargetSrc: "./targets.mind"
  });

const {
  renderer,
  scene,
  camera
} = mindarThree;


// ==========================
// LIGHT
// ==========================

const light =
  new THREE.HemisphereLight(
    0xffffff,
    0xbbbbbb,
    3
  );

scene.add(light);


// ==========================
// VIDEO
// ==========================

const video =
  document.createElement("video");

video.src = "./animasi-truk.mp4";

video.loop = true;
video.muted = true;
video.playsInline = true;

video.setAttribute(
  "playsinline",
  ""
);

video.setAttribute(
  "webkit-playsinline",
  ""
);


// ==========================
// VIDEO TEXTURE
// ==========================

const videoTexture =
  new THREE.VideoTexture(video);

videoTexture.colorSpace =
  THREE.SRGBColorSpace;


// ==========================
// VIDEO MATERIAL
// ==========================

const videoMaterial =
  new THREE.MeshBasicMaterial({
    map: videoTexture,
    transparent: true
  });


// ==========================
// VIDEO PLANE
// ==========================

const videoGeometry =
  new THREE.PlaneGeometry(
    1,
    0.5625
  );

const videoMesh =
  new THREE.Mesh(
    videoGeometry,
    videoMaterial
  );


// ==========================
// TARGET ANCHOR
// ==========================

const anchor =
  mindarThree.addAnchor(0);

anchor.group.add(videoMesh);


// ==========================
// TARGET FOUND
// ==========================

anchor.onTargetFound = () => {

  console.log("TARGET DITEMUKAN");

  video.currentTime = 0;

  video.play().catch(
    error => {
      console.log(
        "Video gagal diputar:",
        error
      );
    }
  );

};


// ==========================
// TARGET LOST
// ==========================

anchor.onTargetLost = () => {

  console.log("TARGET HILANG");

  video.pause();

};


// ==========================
// START AR
// ==========================

async function startAR() {

  await mindarThree.start();

  renderer.setAnimationLoop(() => {

    renderer.render(
      scene,
      camera
    );

  });

}

startAR();

</script>

</body>
</html>
