<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR Truk</title>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #ar-container {
      position: fixed;
      inset: 0;
    }

    #start {
      position: fixed;
      z-index: 9999;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);

      border: 0;
      border-radius: 14px;
      padding: 16px 26px;

      background: #fff;
      color: #111;

      font-size: 16px;
      font-weight: 600;
    }

    #status {
      position: fixed;
      z-index: 9999;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);

      color: #fff;
      background: rgba(0,0,0,.65);

      padding: 10px 16px;
      border-radius: 10px;

      font-size: 14px;
      text-align: center;
    }
  </style>
</head>

<body>

<div id="ar-container"></div>

<button id="start">
  Mulai AR
</button>

<div id="status">
  Tekan Mulai AR
</div>

<script>

const container =
  document.getElementById("ar-container");

const startButton =
  document.getElementById("start");

const status =
  document.getElementById("status");


const mindarThree =
  new MindARThree({
    container: container,
    imageTargetSrc: "./targets.mind"
  });


const renderer =
  mindarThree.renderer;

const scene =
  mindarThree.scene;

const camera =
  mindarThree.camera;


// ============================
// LIGHT
// ============================

const light =
  new THREE.HemisphereLight(
    0xffffff,
    0xbbbbbb,
    3
  );

scene.add(light);


// ============================
// VIDEO
// ============================

const video =
  document.createElement("video");

video.src = "./animasi-truk.mp4";

video.loop = true;
video.muted = true;
video.playsInline = true;

video.setAttribute(
  "playsinline",
  ""
);

video.setAttribute(
  "webkit-playsinline",
  ""
);


// ============================
// VIDEO TEXTURE
// ============================

const texture =
  new THREE.VideoTexture(video);

texture.colorSpace =
  THREE.SRGBColorSpace;


// ============================
// VIDEO MATERIAL
// ============================

const material =
  new THREE.MeshBasicMaterial({
    map: texture
  });


// ============================
// VIDEO OBJECT
// ============================

const geometry =
  new THREE.PlaneGeometry(
    1,
    0.5625
  );

const videoMesh =
  new THREE.Mesh(
    geometry,
    material
  );


// ============================
// TARGET
// ============================

const anchor =
  mindarThree.addAnchor(0);

anchor.group.add(videoMesh);


// ============================
// TARGET FOUND
// ============================

anchor.onTargetFound = () => {

  status.innerText =
    "Target ditemukan";

  video.currentTime = 0;

  video.play().catch(() => {});

};


// ============================
// TARGET LOST
// ============================

anchor.onTargetLost = () => {

  status.innerText =
    "Arahkan kamera ke gambar target";

  video.pause();

};


// ============================
// START AR
// ============================

startButton.addEventListener(
  "click",
  async () => {

    startButton.style.display =
      "none";

    status.innerText =
      "Memulai kamera...";

    try {

      await mindarThree.start();

      status.innerText =
        "Arahkan kamera ke gambar target";

      renderer.setAnimationLoop(() => {

        renderer.render(
          scene,
          camera
        );

      });

    } catch (error) {

      console.error(error);

      startButton.style.display =
        "block";

      status.innerText =
        "Kamera gagal dibuka";

      alert(
        "Kamera gagal dibuka. Pastikan izin kamera untuk browser sudah diizinkan."
      );

    }

  }
);

</script>

</body>
</html>
