<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR Truk</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    #ar-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #start {
      position: fixed;
      z-index: 99999;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      padding: 16px 28px;

      border: none;
      border-radius: 14px;

      background: white;
      color: #111;

      font-size: 17px;
      font-weight: bold;
    }

    #status {
      position: fixed;
      z-index: 99999;

      left: 50%;
      bottom: 30px;

      transform: translateX(-50%);

      padding: 10px 16px;

      border-radius: 10px;

      background: rgba(0,0,0,.7);
      color: white;

      font-size: 14px;

      white-space: nowrap;
    }
  </style>
</head>

<body>

<div id="ar-container"></div>

<button id="start">
  MULAI AR
</button>

<div id="status">
  Tekan MULAI AR
</div>


<!-- THREE.JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.137.5/build/three.min.js"></script>

<!-- MINDAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>


<script>

const container =
  document.getElementById("ar-container");

const startButton =
  document.getElementById("start");

const status =
  document.getElementById("status");


let mindarThree;


// ====================================
// MULAI AR
// ====================================

startButton.onclick = async function () {

  startButton.style.display = "none";

  status.innerText =
    "Memuat AR...";

  try {

    mindarThree =
      new MindARThree({
        container: container,

        imageTargetSrc:
          "./targets.mind"
      });


    const renderer =
      mindarThree.renderer;

    const scene =
      mindarThree.scene;

    const camera =
      mindarThree.camera;


    // ====================================
    // LIGHT
    // ====================================

    const light =
      new THREE.HemisphereLight(
        0xffffff,
        0xbbbbbb,
        3
      );

    scene.add(light);


    // ====================================
    // VIDEO
    // ====================================

    const video =
      document.createElement("video");

    video.src =
      "./animasi-truk.mp4";

    video.loop = true;

    video.muted = true;

    video.playsInline = true;

    video.setAttribute(
      "playsinline",
      ""
    );


    // ====================================
    // VIDEO TEXTURE
    // ====================================

    const texture =
      new THREE.VideoTexture(video);


    // ====================================
    // VIDEO MATERIAL
    // ====================================

    const material =
      new THREE.MeshBasicMaterial({
        map: texture
      });


    // ====================================
    // VIDEO SIZE
    // ====================================

    const geometry =
      new THREE.PlaneGeometry(
        1,
        0.5625
      );


    const videoMesh =
      new THREE.Mesh(
        geometry,
        material
      );


    // ====================================
    // TARGET
    // ====================================

    const anchor =
      mindarThree.addAnchor(0);


    anchor.group.add(
      videoMesh
    );


    // ====================================
    // TARGET DITEMUKAN
    // ====================================

    anchor.onTargetFound = function () {

      status.innerText =
        "TARGET DITEMUKAN";

      video.currentTime = 0;

      video.play().catch(
        function () {}
      );

    };


    // ====================================
    // TARGET HILANG
    // ====================================

    anchor.onTargetLost = function () {

      status.innerText =
        "Arahkan kamera ke gambar target";

      video.pause();

    };


    // ====================================
    // START MINDAR
    // ====================================

    status.innerText =
      "Membuka kamera...";


    await mindarThree.start();


    status.innerText =
      "Arahkan kamera ke gambar target";


    renderer.setAnimationLoop(
      function () {

        renderer.render(
          scene,
          camera
        );

      }
    );


  } catch (error) {

    console.error(error);

    startButton.style.display =
      "block";

    status.innerText =
      "AR gagal dimulai";

    alert(
      "AR gagal dimulai: " +
      error.message
    );

  }

};

</script>

</body>
</html>
